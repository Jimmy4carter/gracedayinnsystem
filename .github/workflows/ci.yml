name: quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gracedayinn_test
          POSTGRES_USER: gracedayinn
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gracedayinn -d gracedayinn_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-forty-characters
      ALLOWED_HOSTS: testserver,localhost
      DATABASE_URL: postgres://gracedayinn:test-only-password@127.0.0.1:5432/gracedayinn_test
      REDIS_URL: redis://127.0.0.1:6379/0
      EMAIL_DELIVERY_PROVIDER: brevo
      BREVO_API_KEY: ci-placeholder-key
      BREVO_WEBHOOK_TOKEN: ci-placeholder-webhook-token-long-enough
      MFA_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DEFAULT_ADMIN_PASSWORD: CI-Admin-Only-Strong-Password-41!
      DEFAULT_MANAGER_PASSWORD: CI-Manager-Only-Strong-Password-42!
      DEFAULT_RECEPTION_PASSWORD: CI-Reception-Only-Strong-Password-43!
      DEFAULT_ACCOUNTANT_PASSWORD: CI-Accountant-Only-Strong-Password-44!
      DEFAULT_HOUSEKEEPING_PASSWORD: CI-Housekeeping-Only-Strong-Password-45!
      DEFAULT_INFO_PASSWORD: CI-Info-Only-Strong-Password-46!
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      OTEL_SERVICE_NAME: graceday-inn-ci
      RELEASE_VERSION: ci-test
      CSRF_TRUSTED_ORIGINS: https://testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pip-audit bandit
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py reconcile_system --json
      - run: python -c "import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'gracedayinn.settings.base'); import django; django.setup(); from django.db import connection; assert connection.vendor == 'postgresql', connection.vendor"
      - run: python manage.py test apps.rooms.tests_postgresql_concurrency --verbosity 2 --noinput
      - run: python manage.py test --noinput
      - run: python manage.py check --deploy --settings=gracedayinn.settings.prod
      - run: bandit -r apps gracedayinn -x "*/migrations/*,*/tests*.py" -ll -q
      - run: pip-audit -r requirements.txt
